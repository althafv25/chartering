name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: offshore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: offshore
      DB_USERNAME: root
      DB_PASSWORD: test-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, pdo_mysql, mbstring, dom, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Backup script checks
        run: |
          bash -n scripts/backup-database.sh
          python3 scripts/test-backup.py
      - name: Backend checks
        working-directory: backend
        run: |
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1024M --no-progress
          vendor/bin/phpunit
          composer audit
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm test
          npm audit
